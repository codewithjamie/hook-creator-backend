version: '3.9'

services:
  api:
    build:
      context: .
      target: runtime
    container_name: openedge-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      UPLOAD_DIR: /tmp/openedge-uploads
      # ── Copy from .env ──────────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-openedge-clips-dev}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
    volumes:
      # Mount source for hot-reload in development
      - ./src:/app/src:ro
      # Persist uploads across restarts
      - openedge-uploads:/tmp/openedge-uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  openedge-uploads:
